server {
    listen 80;
    server_name _;

    location ^~ /media/video/ {
        alias /srv/mangalab/backend_manga/media/video/;
        autoindex off;
        disable_symlinks on;
        sendfile on;
        max_ranges 1;

        limit_except GET HEAD {
            deny all;
        }

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        default_type application/octet-stream;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    location ^~ /media/videos/hls/ {
        alias /srv/mangalab/backend_manga/media/videos/hls/;
        autoindex off;
        disable_symlinks on;
        sendfile on;
        max_ranges 1;

        limit_except GET HEAD {
            deny all;
        }

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        default_type application/octet-stream;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=60" always;
    }
}
